<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Suma de matrices</title>
   <style>
      body {
         font-family: Arial, sans-serif;
         padding: 20px;
      }

      input[type="number"] {
         width: 50px;
         margin: 2px;
         text-align: center;
      }

      #contenedor {
         margin-top: 15px;
         margin-bottom: 15px;
      }

      #resultado {
         margin-top: 20px;
         padding: 10px;
         border: 2px solid #4CAF50;
         display: inline-block;
         background-color: #f9fff9;
      }

      #resultado span {
         display: inline-block;
         width: 50px;
         height: 30px;
         line-height: 30px;
         text-align: center;
         border: 1px solid #ccc;
         margin: 2px;
         background-color: #e6ffe6;
         font-weight: bold;
         color: #2e7d32;
      }

      h1 {
         color: #333;
      }

      button {
         margin-top: 10px;
         margin-bottom: 10px;
         padding: 5px 10px;
         cursor: pointer;
         background-color: #4CAF50;
         color: white;
         border: none;
         border-radius: 4px;
      }

      button:hover {
         background-color: #45a049;
      }
   </style>
</head>
<body>
   <h1>Suma de Matrices</h1>
   <label>Ingresa la dimensión de la matriz:</label>
   <input type="number" id="T1" placeholder="3">
   <input type="number" name="T2" id="T2" placeholder="3">
   <button id="crear">Crear matrices</button>
   <div id="contenedor"></div>
   <button id="sumar">Sumar matrices</button>
   <div id="resultado"></div>

   <script>
      const botonCrear = document.getElementById("crear");
      const botonSumar = document.getElementById("sumar");
      const contenedor = document.getElementById("contenedor");
      const resultado = document.getElementById("resultado");

      botonCrear.addEventListener("click", () => {
         contenedor.innerHTML = "";
         const T1 = parseInt(document.getElementById("T1").value);
         const T2 = parseInt(document.getElementById("T2").value);

         for (let i = 0; i < T1; i++) {
            for (let j = 0; j < T2; j++) {
               const input1 = document.createElement("input");
               input1.type = "number";
               input1.id = `m1_${i}_${j}`;
               input1.value = 3;
               contenedor.appendChild(input1);
            }
            contenedor.appendChild(document.createElement("br"));
         }

         contenedor.appendChild(document.createElement("hr"));

         for (let i = 0; i < T1; i++) {
            for (let j = 0; j < T2; j++) {
               const input2 = document.createElement("input");
               input2.type = "number";
               input2.id = `m2_${i}_${j}`;
               input2.value = 3;
               contenedor.appendChild(input2);
            }
            contenedor.appendChild(document.createElement("br"));
         }
      });

      botonSumar.addEventListener("click", () => {
         resultado.innerHTML = "";
         var T1 = parseInt(document.getElementById("T1").value);
         var T2 = parseInt(document.getElementById("T2").value);
         var matriz1 = [];
         var matriz2 = [];

         for (let i = 0; i < T1; i++) {
            matriz1[i] = [];
            matriz2[i] = [];
            for (let j = 0; j < T2; j++) {
               const val1 = parseFloat(document.getElementById(`m1_${i}_${j}`).value) || 0;
               const val2 = parseFloat(document.getElementById(`m2_${i}_${j}`).value) || 0;
               matriz1[i][j] = val1;
               matriz2[i][j] = val2;
            }
         }

         const sumaMatriz = [];
         for (let i = 0; i < T1; i++) {
            sumaMatriz[i] = [];
            for (let j = 0; j < T2; j++) {
               sumaMatriz[i][j] = matriz1[i][j] + matriz2[i][j];
               const span = document.createElement("span");
               span.textContent = sumaMatriz[i][j];
               resultado.appendChild(span);
            }
            resultado.appendChild(document.createElement("br"));
         }
      });
   </script>
</body>
</html>
