<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>
<body>
   <label>Cuantos numeros?</label>
   <input type="number" id="txtCantidad">
   <button id="btnGenerar" onclick="generar()">Generar</button>
   <div id="nGenerados"></div>
   <button id="btnSumar" onclick="verificar()">verificar</button>
   <div id="divRes"></div>

   <script>
      var cantidad;
      
      function generar(){
      cantidad = parseInt(document.getElementById("txtCantidad").value);
      let divGenerados = document.getElementById("nGenerados");

      for(let i = 0; i < cantidad ;i++){
         let inputn = document.createElement("input");
         inputn.type = "number";
         inputn.id = "txt_" + i; 

         divGenerados.appendChild(inputn);
      }
   }
   function verificar(){
      let divR = document.getElementById("divRes");
      let vectorNum = [];
      for(let i = 0; i < cantidad;i++){
         vectorNum.push(parseInt(document.getElementById("txt_" + i).value))
      }
      let mayor = vectorNum[0];
      for(let i = 1; i < cantidad; i++){
         if(mayor < vectorNum[i]){
            mayor = vectorNum[i];
         }
      }
      divR.innerHTML = "El numero mayor es: " + mayor;
   }

   </script>

</body>
</html>
