<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title> 
</head>
<body>
   <input type="text" id="txtNumero1">
   <input type="text" id="txtNumero2">
   <input type="text" id="txtNumero3">
   <button id="btnOk" onclick="numMayor()">ok</button>
   <div id="Res"></div>

   <script>
      function numMayor()
      {
      let num1 = parseInt(document.getElementById("txtNumero1").value);
      let num2 = parseInt(document.getElementById("txtNumero2").value);
      let num3 = parseInt(document.getElementById("txtNumero3").value);
      let divR = document.getElementById("Res");

      if(num1 > num2 && num1 > num3)
      {
         divR.innerHTML = "el numero mas grande es: " + num1;
         return;
      }
        if(num2 > num1 && num2 > num3)
      {
         divR.innerHTML = "el numero mas grande es: " + num2;
         return;
      }
        if(num3 > num2 && num3 > num1)
      {
         divR.innerHTML = "el numero mas grande es: " + num3;
         return;
      }
      if(num1 == num2 && num1 == num3)
      {
         divR.innerHTML = "los numeros son iguales"
      }
      }
   </script>
</body>
</html>
