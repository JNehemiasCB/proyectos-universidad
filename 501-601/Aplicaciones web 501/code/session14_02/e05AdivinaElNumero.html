   <!-- EJEMPLO 05 ADIVINA EL NÚMERO -->
<!-- Creación de un juego sencillo del tipo "adivina el número".
 El sistema generará un número aleatorio entre 1 y 100
 El jugador intentará a adivinar el número en máximo 8 intentos. Después de cada intento, el sistema debería decirle al jugador si ha acertado o no, y si está equivocado, debería decirle si se ha quedado corto o se ha pasado. 
 El sistema irá mostrando los números que ya se probaron anteriormente. 
 El juego terminará una vez que el jugador acierte o cuando se acaben los intentos. Cuando el juego termina, se le debe dar al jugador la opción de volver a jugar.
 -->
   <h1>Adivina el número</h1>

    <p>Se ha seleccionado un número en forma aleatoria entre 1 y 100. Intenta adivinarlo. Tienes hasta 8 intentos para ello. En cada intento te diremos si el número que introduciste fué menor o mayor.</p>
    
   <!--  Número introducido por el usuario y botón de enviar -->
    <div class="form">
      <label for="guessField">¿Cuál crees que es?: </label>
      <input type="number" min="1" max="100" required id="guessField" class="guessField">
      <input type="submit" value="Enviar" class="guessSubmit">
    </div>
    
    <!-- Párrafos de resultados -->
    <div class="resultParas">
      <p class="guesses"></p>
      <p class="lastResult"></p>
      <p class="lowOrHi"></p>
    </div>
</body>
