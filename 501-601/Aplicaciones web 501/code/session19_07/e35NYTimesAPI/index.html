<!DOCTYPE html>
<html lang="es">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content =" Página del curso de plicaciones web, sesión 19 Ejercicio 35 de JS. Adaptado de Dynamic client-side scripting -MDN https://developer.mozilla.org/en-US/docs/Learn/JavaScript">
  <meta name="author" content =" Ricardo Peña Galeana">
  <link rel="icon" href="../assets/images/favicon.ico">
    <title>NY Times API example</title>
  <script src="script.js" defer></script>
    <link href="style.css" rel="stylesheet">
  </head>
<body>
  <h1>NY Times article search</h1>

  <div class="wrapper">

    <div class="controls">
      <form>
        <p>
          <label for="search">Enter a SINGLE search term (required): </label>
          <input type="text" id="search" class="search" required>
        </p>
        <p>
          <label for="start-date">Enter a start date (format YYYYMMDD): </label>
          <input type="date" id="start-date" class="start-date" pattern="[0-9]{8}">
        </p>
        <p>
          <label for="end-date">Enter an end date (format YYYYMMDD): </label>
          <input type="date" id="end-date" class="end-date" pattern="[0-9]{8}">
        </p>
        <p>
          <button class="submit">Submit search</button>
        </p>
      </form>
    </div>

    <div class="results">
      <nav>
        <button class="prev">Previous </button>
        <button class="next">Next 10</button>
      </nav>

      <section>
      </section>
    </div>

  </div>


</body>
</html>
