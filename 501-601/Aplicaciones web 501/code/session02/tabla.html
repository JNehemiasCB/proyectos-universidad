   <!-- Elementos de bloque
Son los que ocupan todo el ancho disponible y generan un salto de líne antes y despúes
Estructurales y semánticos
<html>, <head>, <body>, <header>,<footer>
<main>, <section>, <article>, <aside>, <nav>, 
De organización y agrupación
<div>, <p>, <hr>, <pre>, <blockquote>, <figure>, <figcaption>, <pre>,<adrees>
Tablas
<table>, <caption>, <thead>, <tr>, <th>, <tbody>, <td>, <tfoot>
<tr>, <td> se consideran elementos de tabla, pero tienen un comportamiento mas “en línea que de bloque”)
Media
i<img>, <picture>, <figure>, <audio>, <video>
Formularios
<form>, <fieldset>, <legend>, <button>, <input>, <label>, <select>, <textarea>, 
Listas
<ul> (lista desordenada)
<ol> (lista ordenada)
<li> (elemento de lista)
<dl> (lista de definiciones)
<dt> (término de definición)
<dd> (descripción de definición)

Los elementos de bloque son los que, por defecto, ocupan todo el ancho disponible y empiezan en una nueva línea.

Algunos Elementos de línea
No provocan salto de línea y solo ocupan el ancho necesario del contenido):

<a>, <abbr>, <b>, <br> , <cite>, <code>, <em>, <i>, <q>, <s>, <span>, <strong>, <sub>, <sup>, <time>, <u> -->
