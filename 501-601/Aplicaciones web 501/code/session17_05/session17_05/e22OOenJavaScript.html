// 1.- Definiendo solamente las propiedades dentro del constructor

    function Persona(nombres, apellidos, edad, genero, intereses) {
        this.nombreCompleto = {
            'nombres': nombres,
            'apellidos' : apellidos
        };
        this.edad = edad;
        this.genero = genero;
        this.intereses = intereses;
    }


// 2.- Definiendo los  métodos en el prototype 
// 2.1.- Definiendo el método bio() en el prototipo

    Persona.prototype.biografia = function() {
    // construye la parte que será igual sin omportar género 
    
        let string = this.nombreCompleto.nombres + ' ' + this.nombreCompleto.apellidos + ' tiene ' + this.edad + ' años de edad. ';
     
    // Personaliza con "a él le gusta" o "a ella le gusta" según género.
    // define la variable que contendrá lalpersonalización
        
        let pronoun;

    // verifica el valor de genero y coloca el valor apropiado 

        if(this.genero === 'masculino' || this.genero === 'Masculino' || this.genero === 'm' || this.genero === 'M') {
            pronoun = 'A él le gusta ';
            } else if(this.genero === 'femenino' || this.genero === 'Femenino' || this.genero === 'f' || this.genero === 'F') {
            pronoun = 'A ella le gusta ';
            } else {
            pronoun = 'Ellos prefieren ';
        }

    // junta las dos partes
        string += pronoun;

    // estructura la segunda parte según número de intereses 1, 2 o 3 
        if(this.intereses.length === 1) {
        string += this.intereses[0] + '.';
        } else if(this.intereses.length === 2) {
        string += this.intereses[0] + ' y ' + this.intereses[1] + '.';
        } else {
        // Si hay más de dos intereses , se realiza un loop 
        // para irlos agregando separados por una coma.

            for(var i = 0; i < this.intereses.length; i++) {
                if(i === this.intereses.length - 1) {
                string += 'y ' + this.intereses[i] + '.';
                } else {
                string += this.intereses[i] + ', ';
                }
            }
        }
    
       return string;
    };
