  <script>
  /* ================OBJETOS =========================
  Un objeto es una colección de datos y funciones relacionados encapsulados entre llaves y a los cuales se denominan propiedades y métodos cuando están dentro de objetos
  */
  // ======== OBJETOS LITERALES (Definidos manualmente)===============
  // Construcción, declaración o definición del objeto Persona
  //  sintáxis:  nombreObjeto{ nombre_Propiedad: valor_Propiedad, ...}

let persona = {             
  nombre : {               //propiedad compuesta (objeto dentro de objeto)
    dePila: 'Beatriz',     // las propiedades tipo String van entre comillas simples o dobles
    apellido: 'Marín'
  },
  edad: 58,               // las propiedades tipo Numbre no van entre comillas
  intereses: ['música', 'gimnacia'],
  biografia: function () {
    // this se refiere al objeto donde se encuentra = objeto actual
    alert(this.nombre.dePila + ' ' + this.nombre.apellido + ' tiene ' + this.edad + ' años. Le gusta la ' + this.intereses[0] + ' y la ' + this.intereses[1] + '.');
  },
  saludo: function() {
    alert('¡Hola ! , mi nombre es '+ this.nombre[0] + '. ');
    
  }
};

/* Notación de punto para acceder a las propiedades de un objeto*/
