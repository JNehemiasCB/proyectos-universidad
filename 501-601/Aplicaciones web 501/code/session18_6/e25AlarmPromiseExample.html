/* ===USANDO ASYNC Y AWAIT CON alarm() ===================
Debido a que alarm() regresa una Promise, podemos realizar
todo lo que se puede hacer con una Promise
*/

    const name = document.querySelector('#name');
    const delay = document.querySelector('#delay');
    const button = document.querySelector('#set-alarm');
    const output = document.querySelector('#output');

    function alarm(person, delay) {
        // Promise solo puede construirse con New en funciones que no las soportan por omisión
        // Su sintáxis es: new Promise(executor),
        // donde xecutor son dos funciones una para el objeto resolve y otra para el objeto reject

        return new Promise((resolve, reject) => {
            if (delay < 0) {
            throw new Error('El retardo de la alarma no puede ser negativo');
            }
        setTimeout(() => {
            resolve(`Despierta, ${person}!`);
            }, delay);
        });
    }

    button.addEventListener('click', async () => {
        try {
        const message = await alarm(name.value, delay.value*1000);
        output.textContent = message;
        }
        catch (error) {
        output.textContent = `No se pudo establecer la alarma: ${error}`;
        }
    });
