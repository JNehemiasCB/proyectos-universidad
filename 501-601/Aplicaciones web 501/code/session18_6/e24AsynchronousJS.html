/* PROGRAMACIÓN SINCRONA ========================
En esta programación el navegador recorre el programa línea a línea, en el mismo orden en que nosotros lo escribimos. En cada punto, el navegador espera a que la línea termine su trabajo antes de pasar a la siguiente.
¿Y si la función síncrona tarda mucho tiempo?
Con una función de larga duración, mientrás esta se esté ejecutando nuestro programa no responde en absoluto: no se puede escribir nada, ni hacer clic, ni nada más.

*/

/* === PROGRAMACIÓN ASÍNCRONA y PROMISES =================================================================
La solución fué usar programación asíncrona. Una de las primeras APIs asíncronas utilizaban funciones callback como la API XMLHttpRequest, actualmente se utilizan PROMISES con la API fech(). A continuación vamos a ver como funciona la programación asíncrona

Una promise es una estructura de control para ops asíncronas sin bloquear el hilo principal de ejecución PERO NO CREA UN NUEVO HILO
Un Promise está en uno de estos estados:a) pending (pendiente): estado inicial, ni cumplido ni rechazado. b) fulfilled (cumplida): lo que significa que la operación se completó con éxito. c) rejected (rechazada): lo que significa que la operación falló.

Una promesa pendiente puede cumplirse con un valor o rechazarse con un motivo (error). Cuando ocurre cualquiera de estas opciones, se llama a los controladores asociados en cola por el método then de una promesa.

Los siguientes ejemplos mostrarán como con el uso de PROMISES se puede seguir ejecutando el programa sin tener que esperar hasta que termine la petición fetch.

Fetch devuelve una promesa y cuando se resuleve la promesa devuelve un objeto Response el cual es un contenedor que contiene:response.status → código HTTP , response.ok → true/false si fue exitoso, response.headers → encabezados.
para convertir la respuesta en un formato se usa alguno de lo siguientes métodos: response.json(), response.text(), response.blob(), 
response.arrayBuffer(). El contenido no estará disponible hasta usar uno de ellos.

*/

/* ==================================== ASYNC and AWAIT ===================================
"async" permite trabajar con código basado en Promise. Añadiendo "async" al inicio de una función la vuelve una "async function".
Dentro de una "async function" se puede utilizar "await" antes de la llamada a la función que regresara una Promise, y hace que espere hasta que  la promesa se termine por lo que devuelve un objeto response "fulfilled"(exitoso) o se "rejected" (rechazado).

await espera hasta que se termine o rechase fetch(). Por lo que en vez de regresar una promesa ,regresa un objeto "response" completado o rechazado.Si fue rechazada lanza un mensaje de error.
En el ejemplo siguiente si la promesa no fué rechazada, esperara hasta que "response.json() parsee el objeto JSON y muestra en consola el valor de una propiedad del mismo y devuelve el objeto recuperado (data)
