<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content =" Página del curso de plicaciones web, sesión 16 Ejercicio 18 de JS. Adaptado de Dynamic client-side scripting -MDN ttps://developer.mozilla.org/en-US/docs/Learn/JavaScript">
   <meta name="author" content =" Ricardo Peña Galeana">
   <link rel="icon" href="../assets/images/favicon.ico">
    <title>Delegación de eventos e event target</title>
    <style>
      .box {
        height:25vh;
        width: 25%;
        float: left;
      }
    </style>
  </head>
  <body>
    <div id="container">
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
   </div>
   <!-- =================================================== -->
    <script>
      /* DELEGACIÓN DE EVENTOS es un mecanismo a través del cual evitamos asignar event listeners a múltiples nodos del DOM, asignando un event listener a solo un nodo padre que contiene el resto de estos nodos. */

      function random(number) {
        return Math.floor(Math.random()*number);
      }
      function bgChange() {
        const rndCol = `rgb(${random(255)}, ${random(255)}, ${random(255)})`;
        return rndCol;
      }
      const container = document.querySelector('#container');

      /* Agregamos un listener al container pero la función que lo manejará utilizará el elemento que fué clickeado y que lo pasa event */
      container.addEventListener('click', event => event.target.style.backgroundColor = bgChange());
      
    </script>
  </body>
</html>
